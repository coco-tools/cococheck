[package]
name = "cococheck-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "cococheck"
path = "src/main.rs"

[dependencies]
cococheck-core = { workspace = true }
clap = { version = "4.6.7", features = ["derive"] }
env_logger = "0.11.11"
log = "0.4.34"
anyhow = "1.0.104"
annotate-snippets = "0.12.17"
