name: Bug report
description: Report something that does not work as expected.
labels: [bug]
body:
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What happened, and what did you expect to happen instead?
    validations:
      required: true
  - type: textarea
    id: message
    attributes:
      label: Commit message
      description: The commit message that is checked incorrectly, if any.
      render: text
  - type: textarea
    id: config
    attributes:
      label: Configuration
      description: The content of your `cococheck.yml`, if any.
      render: yaml
  - type: textarea
    id: command
    attributes:
      label: Command and output
      description: The command you ran and its full output. Run it with `-vv` for debug output.
      render: text
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: The output of `cococheck --version`.
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: e.g. Ubuntu 26.04, macOS 26, Windows 11
