[workspace]
members = [
    "cococheck-cli",
    "cococheck-core"
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
license = "Apache-2.0"
authors = ["Martin Nonnenmacher"]
repository = "https://github.com/mnonnenmacher/cococheck"
homepage = "https://github.com/mnonnenmacher/cococheck"
keywords = ["conventional-commits", "git", "cli", "commit-message", "linter"]
categories = ["command-line-utilities", "development-tools"]

[workspace.dependencies]
cococheck-core = { path = "cococheck-core", version = "0.1.0" }
git2 = "0.21.0"
