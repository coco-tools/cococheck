[package]
name = "cococheck"
version.workspace = true
description = "A fast checker for Conventional Commits messages, distributed as a single binary"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "README.md"
keywords.workspace = true
categories.workspace = true
# Only package what is needed to build and to document the tool, not the other files in the
# workspace root.
include = ["/src/**", "/docs/**", "/LICENSE", "/README.md"]

[[bin]]
name = "cococheck"
path = "src/main.rs"

[dependencies]
cococheck-core = { workspace = true }
clap = { version = "4.6.8", features = ["derive"] }
env_logger = "0.11.11"
log = "0.4.35"
anyhow = "1.0.104"
annotate-snippets = "0.12.18"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"

[workspace]
members = ["cococheck-core"]
# Build, check, and test all crates by default, not only the root package.
default-members = [".", "cococheck-core"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
license = "Apache-2.0"
authors = ["Martin Nonnenmacher"]
repository = "https://github.com/coco-tools/cococheck"
homepage = "https://github.com/coco-tools/cococheck"
keywords = ["conventional-commits", "git", "cli", "commit-message", "linter"]
categories = ["command-line-utilities", "development-tools"]

[workspace.dependencies]
cococheck-core = { path = "cococheck-core", version = "0.1.0" }
git2 = "0.21.0"
